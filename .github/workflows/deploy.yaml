name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Baixa o código do repositório
      - name: Baixar código
        uses: actions/checkout@v4

      # Configura o pnpm
      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      # Configura o Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Atualiza o pnpm-lock.yaml conforme o package.json
      - name: Atualizar lockfile
        run: pnpm install --lockfile-only

      # Instala as dependências
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      # Gera a versão estática do site
      - name: Gerar site
        run: pnpm build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # Configura o GitHub Pages
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      # Envia a pasta gerada pelo Next.js
      # para o ambiente de publicação
      - name: Preparar arquivos para publicação
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      # Publica no GitHub Pages
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
